<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kembara Hijrah: Interaktif Gestur Kamera</title>
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #047857;
      --primary-light: #10b981;
      --gold: #f59e0b;
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Video & Canvas Kamera */
    #webcam {
      display: none;
    }

    #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* Cermin paparan */
      z-index: 1;
      opacity: 0.35;
    }

    /* Kursor Jari Maya */
    #finger-cursor {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.85);
      border: 3px solid #fff;
      box-shadow: 0 0 15px var(--gold);
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      transition: width 0.1s, height 0.1s;
      display: none;
    }

    /* Lapisan Antaramuka Permainan */
    #game-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .header-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 100%;
    }

    .header-panel h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    /* Kad Soalan */
    .question-card {
      background: var(--card-bg);
      color: #1e293b;
      padding: 24px 30px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      text-align: center;
      border-left: 8px solid var(--primary);
    }

    .question-card h2 {
      font-size: 1.35rem;
      line-height: 1.5;
    }

    /* Grid Pilihan Jawapan */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }

    .option-btn {
      position: relative;
      background: var(--card-bg);
      color: #0f172a;
      padding: 22px 20px;
      border-radius: 16px;
      border: 3px solid transparent;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .option-btn.hovered {
      border-color: var(--gold);
      transform: scale(1.03);
      box-shadow: 0 0 20px var(--gold);
    }

    .option-btn .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      width: 0%;
      background: var(--gold);
      transition: width 0.05s linear;
    }

    /* Paparan Status & Pengesanan */
    #status-banner {
      position: absolute;
      bottom: 20px;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- Input Webcam & Output Render -->
  <video id="webcam" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <!-- Kursor Jari Maya -->
  <div id="finger-cursor"></div>

  <!-- UI Permainan -->
  <div id="game-container">
    <div class="header-panel">
      <h1>🕌 Kembara Sirah Hijrah Rasulullah SAW</h1>
      <p style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px;">
        Arahkan <b>jari telunjuk</b> anda pada skrin kamera ke jawapan yang tepat selama 1 saat.
      </p>
      <div class="stats">
        <div>Soalan: <span id="q-number" style="color: var(--gold);">1</span> / <span id="q-total">5</span></div>
        <div>Markah: <span id="score" style="color: var(--primary-light);">0</span></div>
      </div>
    </div>

    <div class="question-card">
      <h2 id="question-text">Memuatkan soalan...</h2>
    </div>

    <div class="options-grid" id="options-container">
      <!-- Pilihan jawapan dijana oleh JavaScript -->
    </div>
  </div>

  <div id="status-banner">Sila benarkan akses kamera untuk mula mengesan gestur jari...</div>

  <script>
    // Bank Soalan Sirah Hijrah Nabi ke Madinah
    const questions = [
      {
        question: "Di manakah Rasulullah SAW dan Saidina Abu Bakar bersembunyi selama 3 malam daripada kaum Quraisy?",
        options: ["Gua Hira'", "Gua Thaur", "Bukit Uhud", "Masjidil Haram"],
        answer: "Gua Thaur"
      },
      {
        question: "Siapakah pemuda yang berani tidur di tempat tidur Nabi SAW untuk mengelirukan kaum kafir Quraisy?",
        options: ["Saidina Ali bin Abi Talib", "Saidina Umar bin Al-Khattab", "Zaid bin Harithah", "Bilal bin Rabah"],
        answer: "Saidina Ali bin Abi Talib"
      },
      {
        question: "Apakah nama masjid pertama yang dibina oleh Rasulullah SAW dalam perjalanan hijrah?",
        options: ["Masjid Nabawi", "Masjid Quba'", "Masjidil Aqsa", "Masjid Terapung"],
        answer: "Masjid Quba'"
      },
      {
        question: "Siapakah penunggang kuda handal yang mengejar Nabi namun kudanya terbenam ke dalam pasir?",
        options: ["Abu Jahal", "Abu Lahab", "Suraqah bin Malik", "Al-Walid bin al-Mughirah"],
        answer: "Suraqah bin Malik"
      },
      {
        question: "Apakah nama asal kota Madinah Al-Munawwarah sebelum peristiwa Hijrah?",
        options: ["Yathrib", "Taif", "Badr", "Kufah"],
        answer: "Yathrib"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hoveredElement = null;
    let hoverStartTime = null;
    const HOVER_THRESHOLD = 1000; // 1 saat pegang jari untuk sahkan pilihan

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const fingerCursor = document.getElementById('finger-cursor');
    const statusBanner = document.getElementById('status-banner');

    function renderQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById('q-number').innerText = currentQuestionIndex + 1;
      document.getElementById('q-total').innerText = questions.length;
      document.getElementById('question-text').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt) => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.dataset.answer = opt;
        btn.innerHTML = `<span>${opt}</span><div class="progress-bar"></div>`;
        container.appendChild(btn);
      });
    }

    // Periksa sama ada posisi kursor jari bertembung dengan kotak jawapan
    function checkInteractions(cursorX, cursorY) {
      const buttons = document.querySelectorAll('.option-btn');
      let isHoveringAny = false;

      buttons.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        const progressBar = btn.querySelector('.progress-bar');

        if (
          cursorX >= rect.left &&
          cursorX <= rect.right &&
          cursorY >= rect.top &&
          cursorY <= rect.bottom
        ) {
          isHoveringAny = true;

          if (hoveredElement !== btn) {
            if (hoveredElement) {
              hoveredElement.classList.remove('hovered');
              const prevBar = hoveredElement.querySelector('.progress-bar');
              if (prevBar) prevBar.style.width = '0%';
            }
            hoveredElement = btn;
            hoverStartTime = Date.now();
            btn.classList.add('hovered');
          } else {
            const elapsed = Date.now() - hoverStartTime;
            const percentage = Math.min((elapsed / HOVER_THRESHOLD) * 100, 100);
            progressBar.style.width = `${percentage}%`;

            if (elapsed >= HOVER_THRESHOLD) {
              validateAnswer(btn.dataset.answer);
              hoveredElement = null;
              hoverStartTime = null;
            }
          }
        }
      });

      if (!isHoveringAny && hoveredElement) {
        hoveredElement.classList.remove('hovered');
        const prevBar = hoveredElement.querySelector('.progress-bar');
        if (prevBar) prevBar.style.width = '0%';
        hoveredElement = null;
        hoverStartTime = null;
      }
    }

    function validateAnswer(selectedAnswer) {
      const correct = questions[currentQuestionIndex].answer;
      if (selectedAnswer === correct) {
        score += 20;
        document.getElementById('score').innerText = score;
        statusBanner.innerText = `✅ Tepat sekali! "${selectedAnswer}" adalah jawapan yang betul.`;
        statusBanner.style.background = 'rgba(4, 120, 87, 0.9)';
      } else {
        statusBanner.innerText = `❌ Kurang tepat. Jawapan sebenar ialah: ${correct}`;
        statusBanner.style.background = 'rgba(220, 38, 38, 0.9)';
      }

      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        setTimeout(() => {
          renderQuestion();
          statusBanner.innerText = 'Arahkan jari telunjuk anda ke jawapan seterusnya...';
          statusBanner.style.background = 'rgba(0, 0, 0, 0.75)';
        }, 1500);
      } else {
        setTimeout(showGameOver, 1500);
      }
    }

    function showGameOver() {
      const container = document.getElementById('game-container');
      container.innerHTML = `
        <div class="header-panel" style="padding: 40px;">
          <h1 style="color: var(--gold); font-size: 2.2rem;">Tahniah! Permainan Tamat</h1>
          <p style="font-size: 1.3rem; margin: 20px 0;">Jumlah Markah Anda: <b>${score} / 100</b></p>
          <p style="color: #cbd5e1; line-height: 1.6;">
            Semoga iktibar pengorbanan dan perpaduan peristiwa Hijrah Rasulullah SAW ke Madinah terus dihayati.
          </p>
          <button onclick="location.reload()" style="margin-top: 25px; padding: 12px 28px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem;">
            Main Semula
          </button>
        </div>
      `;
      fingerCursor.style.display = 'none';
    }

    // Konfigurasi MediaPipe Hands
    function onResults(results) {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusBanner.innerText = '🟢 Tangan dikesan! Gerakkan jari telunjuk ke kotak jawapan.';
        statusBanner.style.background = 'rgba(0, 0, 0, 0.75)';

        const landmarks = results.multiHandLandmarks[0];
        // Mercu tanda 8 ialah hujung jari telunjuk (INDEX_FINGER_TIP)
        const indexTip = landmarks[8];

        // Koordinat skrin (dibalikkan secara horizontal kerana video dicerminkan)
        const screenX = (1 - indexTip.x) * window.innerWidth;
        const screenY = indexTip.y * window.innerHeight;

        fingerCursor.style.display = 'block';
        fingerCursor.style.left = `${screenX}px`;
        fingerCursor.style.top = `${screenY}px`;

        checkInteractions(screenX, screenY);
      } else {
        fingerCursor.style.display = 'none';
        if (currentQuestionIndex < questions.length) {
          statusBanner.innerText = '⚠️ Angkat tangan dan tunjukkan jari telunjuk ke arah kamera.';
        }
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start().catch(err => {
      statusBanner.innerText = 'Gagal mengakses kamera. Sila pastikan izin kamera diberikan.';
      console.error(err);
    });

    renderQuestion();
  </script>
</body>
</html>
